version: 2

project_name: skylite

before:
  hooks:
    - go mod download

builds:
  - id: skylite
    main: ./cmd/skylite
    binary: skylite
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: skylite
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE

checksum:
  name_template: "SHA256SUMS"
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive

signs:
  - id: checksum-cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
    output: true

release:
  draft: false
  prerelease: auto

changelog:
  use: github
  sort: asc
