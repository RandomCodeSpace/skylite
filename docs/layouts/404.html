{{ define "bodyclass" }}notfound{{ end }}
{{ define "main" }}
<section class="wrap lost">
  <p class="lost-code" aria-hidden="true">404</p>
  <h1>This page is not on the drawing</h1>
  <p class="lede">Nothing exists at this address. Check the spelling, or start again from one of these pages.</p>
  <ul class="lost-links">
    <li><a href="{{ site.Home.RelPermalink }}">Go to the home page</a></li>
    <li><a href="{{ (site.GetPage "/docs").RelPermalink }}">Browse the documentation</a></li>
  </ul>
</section>
{{ end }}
