      <title id="dgw-t">Target architecture of skylite (planned design, not implemented)</title>
      <desc id="dgw-d">Go and Java services call skylite over HTTPS through ingress or Istio. One database is served by a group of skylite pods without persistent volumes: one leader takes all writes, uploads each commit and reads pages on demand; followers forward writes to the leader and fetch pages on demand. Object storage holds the lease object, the commit log, the base page groups and the manifest. A write is acknowledged only after the upload is confirmed. Conditional writes fence a stale leader; the lease only helps a takeover make progress.</desc>

        <marker id="dgw-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="dg-head" d="M0 1 9 5 0 9z"/></marker>

  <details class="sheet-alt">
    <summary>Read the diagram as text</summary>
    <ol>
      <li>Go services (through the <code>database/sql</code> driver) and Java services (through the JDBC driver) send SQL over HTTPS, through ingress or Istio.</li>
      <li>A group of skylite pods serves one database. The pods have no persistent volumes.</li>
      <li>One pod is the leader. It takes all writes and keeps a working copy on ephemeral disk.</li>
      <li>The other pods are followers. They forward writes to the leader and serve reads by fetching pages from object storage on demand, with a bounded cache.</li>
      <li>The leader uploads change files and snapshots to object storage. A write is acknowledged only after the upload is confirmed.</li>
      <li>Object storage (Azure Blob, S3, GCS or local filesystem) also holds the lease object. Conditional writes fence a stale leader; the lease only helps a takeover make progress.</li>
    </ol>
  </details>
