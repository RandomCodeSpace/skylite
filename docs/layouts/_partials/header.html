{{- $docs := site.GetPage "/docs" -}}
{{- $roadmap := site.GetPage "/docs/roadmap" -}}
<header class="masthead">
  <div class="wrap bar">
    <a class="brand" href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ partial "mark.html" }}<span class="brand-name">skylite</span></a>
    <span class="phase" title="Beta: the server runs, tested against storage emulators only; see the roadmap">beta</span>
    <nav class="sitenav" aria-label="Site">
      <ul>
        <li><a href="{{ $docs.RelPermalink }}"{{ if or (eq . $docs) (.IsDescendant $docs) }} aria-current="{{ cond (eq . $docs) "page" "true" }}"{{ end }}>Docs</a></li>
        <li><a href="{{ $roadmap.RelPermalink }}"{{ if eq . $roadmap }} aria-current="page"{{ end }}>Roadmap</a></li>
        <li><a href="{{ site.Params.repo }}">GitHub</a></li>
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="i-moon" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/><g class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg>
      <span class="sr-only">Dark theme</span>
    </button>
  </div>
</header>
