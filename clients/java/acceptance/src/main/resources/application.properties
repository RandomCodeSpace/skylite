# The JDBC URL, driver class and dialect come from spring.datasource.url,
# spring.datasource.driver-class-name and spring.jpa.database-platform, which
# Surefire sets as system properties from -Djdbc.url, -Djdbc.driver and
# -Djdbc.dialect (pom.xml). Environment variables cannot override them.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.main.banner-mode=off
