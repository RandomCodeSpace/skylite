# The JDBC URL, driver class and dialect are the system properties jdbc.url,
# jdbc.driver and jdbc.dialect, which Surefire sets from -Djdbc.url, -Djdbc.driver
# and -Djdbc.dialect (pom.xml). ConnectionReport fails start-up if the
# application ends up using anything else.
spring.datasource.url=${jdbc.url}
spring.datasource.driver-class-name=${jdbc.driver}
spring.jpa.database-platform=${jdbc.dialect}
spring.jpa.hibernate.ddl-auto=create
# Hibernate otherwise logs a failed CREATE, DROP or ALTER and carries on.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2
spring.main.banner-mode=off
