version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      # azblob v1.8.1 and later add github.com/apache/arrow-go/v18 to the module
      # graph (checked with go mod graph), which is far more code than a blob
      # client needs; the bump in #11 also fails govulncheck. Stay on v1.8.0.
      - dependency-name: github.com/Azure/azure-sdk-for-go/sdk/storage/azblob
        versions: [">= 1.8.1"]
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /clients/java/acceptance
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /clients/java/driver
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      jdbc-maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /internal/spike/flightsql
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      spike-gomod-minor-patch:
        update-types: [minor, patch]
