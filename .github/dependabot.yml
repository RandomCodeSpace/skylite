version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /clients/java/acceptance
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /internal/spike/flightsql
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      spike-gomod-minor-patch:
        update-types: [minor, patch]
