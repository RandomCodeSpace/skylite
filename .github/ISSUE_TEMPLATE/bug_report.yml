name: Bug report
description: Report behaviour that does not match the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal commands or code that reproduce the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: skylite version
      description: Output of `skylite version`, or the commit you built from.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go version, and storage backend if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove credentials and other secrets first.
      render: text
