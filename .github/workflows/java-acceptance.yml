name: Java acceptance

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs for pull requests only; main and merge-group runs each get a unique group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java-acceptance:
    name: java-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21.0.13+9"

      # Every event restores the Maven repository, but only pushes to main save it,
      # so a pull request or merge-group run cannot write an entry that main reads.
      - name: Restore Maven repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('clients/java/acceptance/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Run the acceptance suite against sqlite-jdbc
        run: |
          mvn -v
          make java-acceptance

      - name: Check that the suite catches injected driver faults
        run: make java-fault-check

      - name: Save Maven repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('clients/java/acceptance/pom.xml') }}

  jdbc-driver:
    name: jdbc-driver
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21.0.13+9"

      # The integration test builds cmd/skylite and runs it.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: go.mod

      # As for java-acceptance: every event restores, only pushes to main save.
      - name: Restore Maven repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-jdbc-${{ runner.os }}-${{ hashFiles('clients/java/driver/pom.xml') }}
          restore-keys: maven-jdbc-${{ runner.os }}-

      - name: Run the JDBC driver's unit and integration tests
        run: |
          mvn -v
          make jdbc-driver

      - name: Save Maven repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-jdbc-${{ runner.os }}-${{ hashFiles('clients/java/driver/pom.xml') }}

  # The acceptance suite through skylite's JDBC driver and Hibernate dialect, against a skylite serve
  # that the test run builds from this tree with Go and starts.
  java-acceptance-skylite:
    name: java-acceptance-skylite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21.0.13+9"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: go.mod

      # As for java-acceptance: every event restores, only pushes to main save.
      - name: Restore Maven repository
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-skylite-${{ runner.os }}-${{ hashFiles('clients/java/acceptance/pom.xml', 'clients/java/driver/pom.xml', 'clients/java/hibernate/pom.xml') }}
          restore-keys: maven-skylite-${{ runner.os }}-

      - name: Run the acceptance suite against skylite
        run: |
          mvn -v
          make java-acceptance-skylite

      # The driver and the dialect this run installed are built from the tree, never cached.
      - name: Drop the installed skylite artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: rm -rf ~/.m2/repository/io/github/randomcodespace

      - name: Save Maven repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-skylite-${{ runner.os }}-${{ hashFiles('clients/java/acceptance/pom.xml', 'clients/java/driver/pom.xml', 'clients/java/hibernate/pom.xml') }}
