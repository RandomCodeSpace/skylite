name: Docs

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled. Runs on main are never cancelled mid-flight;
# the event name keeps scheduled runs out of the push/deploy group.
concurrency:
  group: docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: "0.170.0"
  # sha256 of hugo_0.170.0_linux-amd64.tar.gz, from the release's hugo_0.170.0_checksums.txt
  HUGO_SHA256: "0930754ec22ad2dd1a252f8c31a5e57faccc9d15f1c3d381ddafcb96eeb8aef0"
  LYCHEE_VERSION: "0.24.2"
  # sha256 of lychee-x86_64-unknown-linux-gnu.tar.gz, from the release's .sha256 file
  LYCHEE_SHA256: "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a"

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false

      - name: Install Hugo
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/hugo"
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$tarball" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${tarball}"
          echo "${HUGO_SHA256}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" hugo
          echo "$dir" >> "$GITHUB_PATH"

      - name: Install lychee
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/lychee"
          tarball="lychee-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$tarball" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${tarball}"
          echo "${LYCHEE_SHA256}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$dir" >> "$GITHUB_PATH"

      - name: Build site
        run: |
          hugo version
          make docs

      - name: Check internal links and anchors (offline)
        run: make docs-linkcheck

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  external-links:
    name: external-links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: false

      - name: Install Hugo
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/hugo"
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$tarball" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${tarball}"
          echo "${HUGO_SHA256}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" hugo
          echo "$dir" >> "$GITHUB_PATH"

      - name: Install lychee
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/lychee"
          tarball="lychee-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$tarball" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${tarball}"
          echo "${LYCHEE_SHA256}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          echo "$dir" >> "$GITHUB_PATH"

      - name: Build site
        run: make docs

      - name: Check all links, including external ones
        env:
          GITHUB_TOKEN: ${{ github.token }} # lychee uses it to avoid github.com rate limits
        run: make docs-linkcheck DOCS_LINKCHECK_MODE=
